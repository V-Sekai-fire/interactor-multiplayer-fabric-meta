name: Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: elixir test/smoke_db.exs activate_smoke_test.exs activate_smoke_test_windows.exs

  sqlite-fdb:
    # The same check with the run log in a real FoundationDB.
    runs-on: ubuntu-latest
    env:
      SMOKE_WEFTFDB_EXTENSION: ${{ github.workspace }}/datasource-store/build/weftfdb
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Start a single-node FoundationDB
        run: |
          curl -fsSLO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          curl -fsSLO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-server_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb foundationdb-server_7.3.63-1_amd64.deb
          timeout 120 bash -c 'until fdbcli --exec "status minimal" --timeout 5 | grep -q "available"; do sleep 2; done'
      - name: Check out datasource-store at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/datasource-store
          ref: bf5d552f5dee0fc871b474c5362ad782a49e89c7
          path: datasource-store
      - name: Build the weftfdb extension
        working-directory: datasource-store
        run: |
          sudo apt-get install -y -q cmake libsqlite3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target weftfdb
      - run: elixir test/smoke_db.exs activate_smoke_test.exs activate_smoke_test_windows.exs
      - name: The run log lives in FoundationDB
        run: |
          keys=$(fdbcli --exec "getrangekeys weft/db/ weft/db0 100" | grep -c "weft/db/smoke_test_")
          echo "keys under weft/db/smoke_test_*: $keys"
          test "$keys" -gt 0
